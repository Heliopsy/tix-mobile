extends: default
ignore: |
  build/
  dist/
  coverage/
  .dart_tool/
  .worktrees/
  **/Pods/
  **/node_modules/
  # Written by pub, never by hand.
  pubspec.lock
  # tix's generated OpenAPI document, vendored byte for byte.
  api/tix-openapi.yaml
rules:
  line-length:
    max: 120
    level: warning
  document-start: disable
  # GitHub's `on:` key is a YAML 1.1 boolean to yamllint; values are still checked.
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 2
