#
# The F-Droid recipe, to be submitted to fdroiddata as
# metadata/red.tix.tix_mobile.yml together with srclibs/tix.yml. Store text,
# icon and changelogs come from fastlane/metadata/android in this repository,
# which F-Droid reads at the built tag.
#
# Three builds per release, one per ABI. Flutter's --split-per-abi adds
# 1000 x the ABI number to the version code, which here is the "+N" that
# release-please increments in pubspec.yaml on every release, so the codes
# never collide: 1000+N (armeabi-v7a), 2000+N (arm64-v8a), 4000+N (x86_64).
# They differ from the GitHub release APKs' codes on purpose: F-Droid signs
# with its own key, so the two never update each other anyway.
#
# Go comes from fdroiddata's go srclib, built from source with the Debian
# golang-go as bootstrap, the way other Go-on-Android recipes there do it.
# hook/build.dart builds libtix from a tix checkout in its cache when one is
# there, so the tix srclib is checked out at the commit tix.lock names and put
# where the hook looks instead of fetched. Reading the commit from tix.lock
# keeps builds that checkupdates copies forward right when the engine moves.
# A build without Go on PATH would quietly ship no engine, so each build ends
# by checking the APK carries libtix.so.
#
# fdroiddata wants a full hash in `commit:`; it is the commit v0.20.1 tags.
# The body below is what `fdroid rewritemeta` writes, so it can be copied to
# fdroiddata as is.

Categories:
  - Task
License: AGPL-3.0-or-later
AuthorName: tix-mobile contributors
WebSite: https://github.com/heliopsy/tix-mobile
SourceCode: https://github.com/heliopsy/tix-mobile
IssueTracker: https://github.com/heliopsy/tix-mobile/issues
Changelog: https://github.com/heliopsy/tix-mobile/blob/HEAD/CHANGELOG.md

AutoName: tix

RepoType: git
Repo: https://github.com/heliopsy/tix-mobile.git

Builds:
  - versionName: 0.20.1
    versionCode: 1025
    commit: c8ea6dfc9c0580dba7175e021b0a689e5963e0a4
    sudo:
      - apt-get update
      - apt-get install -y -t trixie-backports golang-go
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@3.47.9
      - go@go1.27.4
      - tix@27923cb573ce465cca676f736f98c06b58f23093
    rm:
      - ios
      - linux
      - macos
      - windows
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - tixc=$(sed -n 's/^commit = //p' tix.lock)
      - git -C $$tix$$ checkout -q $tixc
      - mkdir -p $HOME/.cache/tix-mobile/libtix/src
      - cp -a $$tix$$ $HOME/.cache/tix-mobile/libtix/src/$tixc
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - pushd $$go$$/src
      - ./make.bash
      - popd
      - export PATH=$$flutter$$/bin:$$go$$/bin:$PATH GOROOT=$$go$$
      - export ANDROID_NDK_HOME=$$NDK$$ PUB_CACHE=$(pwd)/.pub-cache
      - flags="--split-per-abi --dart-define=TIX_SELF_UPDATE=false"
      - flutter build apk $flags --target-platform=android-arm
      - apk=build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
      - unzip -l $apk lib/armeabi-v7a/libtix.so
    ndk: r28c

