include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - lib/**/*.g.dart
    - lib/**/*.freezed.dart
    - lib/l10n/generated/**
    - android/**
    - ios/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    invalid_annotation_target: ignore

plugins:
  riverpod_lint: 3.2.0

linter:
  rules:
    public_member_api_docs: false
    # Dart 3.13's `new(...)`/`factory name(...)` declarations are too new for
    # freezed and for most readers; keep the class name in constructors.
    unnecessary_type_name_in_constructor: false
