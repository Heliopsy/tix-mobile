#
# Every operation in api/tix-openapi.yaml that lib/src/core/capability/
# registry.dart does not bind is listed here, exactly once:
#
#   exempt   the app deliberately never offers it; say why.
#   pending  planned, by wave. Binding one moves it from here to registry.dart.
#
# test/core/capability/operations_test.dart fails on an operation in neither
# place, in both, or named here but gone from the spec. `just parity` reports
# coverage per wave.
#
# Waves: 1 daily work, 2 team, 3 admin.

exempt:
  api.spec:
    reason: the OpenAPI document the client is generated from at build time; nothing to show at run time
  calendar.read:
    reason: >-
      the feed is iCalendar for a calendar app, read without a credential; the app hands out its address
      (calendar.show)
  claim.next:
    reason: claiming is the agent work queue; a person picks a task by name instead
  claim.release:
    reason: a lease is released by the worker holding its token, which the app never holds
  claim.renew:
    reason: a lease is renewed by the worker holding its token, which the app never holds
  claim.sweep:
    reason: lease sweeping is a background maintenance loop, not an action a person takes
  claim.task:
    reason: claiming is the agent work queue; the lease token it returns belongs to a worker, not a person
  domain.resolve:
    reason: hostname resolution runs before any screen is chosen, on the server; tix exempts it from the web UI too
  server.ready:
    reason: a readiness probe for a load balancer; server.health already tells the app a server is tix
  session.ssh_challenge:
    reason: SSH key sign-in signs a challenge with ssh-agent or a private key, which the app does not hold
  session.ssh_login:
    reason: SSH key sign-in signs a challenge with ssh-agent or a private key, which the app does not hold
  task.wake:
    reason: waking snoozed tasks is a background loop beside the lease sweep, not an action a person takes
  totp.verify:
    reason: a sign-in proves its second factor by posting the ticket and code to session.login, as the web UI does
  user.show:
    reason: >-
      the user administration list already shows every field a single user screen would; tix exempts it from the
      web UI too

pending:
  # Wave 1, daily work: tasks, comments, fields, tags, dependencies, artifacts,
  # time, views, filters, inbox, search, stars, snooze, templates, bulk.
  wave1:
    - filter.show
    - task.lease
    - task.tags
    - task.transition
    - time.prefs.set
    - time.settings
  # Wave 2, team: projects, workflows, fields, users, members, invites, tokens, calendar, export.
  wave2:
    - bundle.export
    - bundle.import
    - invite.accept
    - invite.preview
    - snapshot.import
    - status.read
    - token.rotate
  # Wave 3, admin: tenants, global admin, domains, webhooks, sync, retention, audit, second factor, SSH keys.
  wave3:
