name: Gate tools
description: >-
  Install the pinned lint and scan tools onto PATH (Linux x64), at the
  versions scripts/tool.sh reports, plus just and node for the npx tools.
  Binaries are cached by version and downloaded with the workflow token,
  since GitHub throttles anonymous release downloads first under load.

runs:
  using: composite
  steps:
    - id: versions
      shell: bash
      run: |
        set -euo pipefail
        {
          for t in actionlint shellcheck yamllint gitleaks reuse; do
            echo "$t=$(scripts/tool.sh version "$t")"
          done
          printf 'binaries=j%s-al%s-sc%s-gl%s\n' \
            "$(awk '$1 == "just" { print $2 }' .tool-versions)" \
            "$(scripts/tool.sh version actionlint)" \
            "$(scripts/tool.sh version shellcheck)" \
            "$(scripts/tool.sh version gitleaks)"
          echo "just=$(awk '$1 == "just" { print $2 }' .tool-versions)"
        } >> "$GITHUB_OUTPUT"

    # markdownlint and openspec run through npx at the versions scripts/tool.sh
    # pins; this only fixes which node runs them.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
      with:
        node-version: 22
        package-manager-cache: false

    # The release downloads below come from github.com, which now and then
    # answers 504 for minutes at a time; a cache hit skips them entirely.
    - id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ${{ runner.temp }}/tools/bin
        key: gate-tools-${{ runner.os }}-${{ steps.versions.outputs.binaries }}

    # TOOL_MODE=path makes scripts/tool.sh fail rather than fall back to a
    # container or another version: here the exact versions are installed, so
    # anything else on PATH would be a bug in this action and should say so.
    - shell: bash
      env:
        ACTIONLINT: ${{ steps.versions.outputs.actionlint }}
        SHELLCHECK: ${{ steps.versions.outputs.shellcheck }}
        YAMLLINT: ${{ steps.versions.outputs.yamllint }}
        GITLEAKS: ${{ steps.versions.outputs.gitleaks }}
        REUSE: ${{ steps.versions.outputs.reuse }}
        CACHED: ${{ steps.cache.outputs.cache-hit }}
        JUST: ${{ steps.versions.outputs.just }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        bin="$RUNNER_TEMP/tools/bin"
        mkdir -p "$bin"
        cd "$RUNNER_TEMP/tools"

        # Authenticated: GitHub throttles anonymous release downloads first
        # when it is under load. $1 is owner/repo, $2 the tag, $3 the asset.
        fetch() {
          local try
          for try in 1 2 3 4 5 6; do
            gh release download "$2" -R "$1" -p "$3" -O "$3" --clobber && return 0
            echo "download of $3 failed (try $try), retrying in 10s" >&2
            sleep 10
          done
          return 1
        }

        if [ "$CACHED" != "true" ]; then
          fetch casey/just "${JUST}" "just-${JUST}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf "just-${JUST}-x86_64-unknown-linux-musl.tar.gz" -C "$bin" just

          fetch rhysd/actionlint "v${ACTIONLINT}" "actionlint_${ACTIONLINT}_linux_amd64.tar.gz"
          tar -xzf "actionlint_${ACTIONLINT}_linux_amd64.tar.gz" -C "$bin" actionlint

          sc="shellcheck-v${SHELLCHECK}"
          fetch koalaman/shellcheck "v${SHELLCHECK}" "${sc}.linux.x86_64.tar.xz"
          tar -xJf "${sc}.linux.x86_64.tar.xz" --strip-components=1 -C "$bin" "${sc}/shellcheck"

          fetch gitleaks/gitleaks "v${GITLEAKS}" "gitleaks_${GITLEAKS}_linux_x64.tar.gz"
          tar -xzf "gitleaks_${GITLEAKS}_linux_x64.tar.gz" -C "$bin" gitleaks
        fi

        pipx install --quiet "yamllint==${YAMLLINT}"
        pipx install --quiet "reuse==${REUSE}"

        echo "$bin" >> "$GITHUB_PATH"
        {
          echo "TOOL_MODE=path"
          echo "OPENSPEC_TELEMETRY=0"
        } >> "$GITHUB_ENV"
