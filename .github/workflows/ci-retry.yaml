name: CI retry

# Reruns a failed CI run once when every failure came from the platform
# rather than the code: a job no runner picked up (hosted macOS capacity),
# or a job that died while downloading its tools. A failing test, lint or
# build is never retried. Merge-queue runs are left alone, since the queue
# has already dropped the entry by the time this runs.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: read-all

jobs:
  retry:
    name: Retry platform failures
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.event != 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Rerun if only the platform failed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          jobs=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --jq '.jobs[]')
          # The roll-up job fails whenever anything else does; judge the rest.
          bad=$(jq -c 'select(.name != "CI ok")
            | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")' <<<"$jobs")
          if [ -z "$bad" ]; then
            echo "Nothing failed besides the roll-up; not retrying."
            exit 0
          fi
          # Platform failure: no runner ever ran a step, or the first failing
          # step is setup (job set-up, tool or Flutter download).
          code=$(jq -r '
            (.steps // []) as $steps
            | ([$steps[] | select(.conclusion == "failure" or .conclusion == "cancelled")][0].name // "") as $step
            | select((($steps | length) == 0 or ($step | test("^(Set up job|Run \\./\\.github/actions/(tools|flutter))$"))) | not)
            | "\(.name): \($step)"' <<<"$bad")
          if [ -n "$code" ]; then
            echo "Not retrying, these failed in the code's own steps:"
            echo "$code"
            exit 0
          fi
          echo "Only platform failures:"
          jq -r '"\(.name) (\(.conclusion))"' <<<"$bad"
          gh run rerun "$RUN_ID" --repo "$REPO" --failed
