name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions: read-all

jobs:
  # CodeQL has no Dart extractor, so the app itself cannot be analysed here;
  # `flutter analyze --fatal-infos` in CI is what reads the Dart. What CodeQL
  # can read is the workflows: the `actions` language finds expression
  # injection into run: blocks, untrusted checkouts under pull_request_target
  # and over-broad tokens, which matters in a public repository whose CLA and
  # PR-title workflows run on pull_request_target.
  analyze:
    name: Analyze GitHub Actions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          languages: actions
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          category: /language:actions
