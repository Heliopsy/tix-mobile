name: PR Title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  # Reports the required check in the merge queue, where the title was
  # already checked on the pull request; the job skips there.
  merge_group:

permissions: read-all

jobs:
  conventional:
    name: Conventional commit title
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      # release-please derives the version bump from commit types, so a
      # non-conventional squash-merge title would silently break versioning.
      # Nothing is checked out: under pull_request_target that would run a
      # stranger's code with this repository's token.
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6  # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
