name: Release

# Builds every platform for a tag, attaches the packages, checksums and their
# signature to the tag's release, and publishes it.
#
# Triggers: a tag pushed by hand, or a dispatch from release-please.yml. The
# tag release-please writes uses GITHUB_TOKEN, which raises no push event, so
# release-please asks for this build explicitly. There is deliberately no
# `release: published` trigger: release-please creates a DRAFT, and this
# workflow is what publishes it, as its last step, once the downloads are
# attached. Listening for "published" too would only rebuild what was just
# released. Dispatching by hand rebuilds an existing tag; uploads replace
# assets of the same name.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: The tag to build, e.g. v0.1.0.
        required: true
        type: string

permissions: read-all

# One build per tag at a time; a second dispatch for the same tag waits rather
# than racing the first to the same asset names.
concurrency:
  group: release-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Prepare the release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.names.outputs.tag }}
      version: ${{ steps.names.outputs.version }}
      mobile: ${{ steps.names.outputs.mobile }}
      desktop: ${{ steps.names.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Resolve the tag and the build flags
        id: names
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          tag="${REF:-$GITHUB_REF_NAME}"
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "mobile=$(scripts/build-version.sh "$tag" mobile)"
            echo "desktop=$(scripts/build-version.sh "$tag" desktop)"
          } >> "$GITHUB_OUTPUT"

      # release-please leaves a draft. A tag pushed by hand has no release at
      # all, so one is created as a draft here, to be published by the last
      # job like any other. The releases list rather than `gh release view`,
      # which cannot see a draft.
      - name: Make sure a release exists for the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.names.outputs.tag }}
        run: |
          set -euo pipefail
          n=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                | jq --arg t "$TAG" '[.[] | select(.tag_name == $t)] | length')
          if [ "$n" = "0" ]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes --title "$TAG"
            echo "created a draft release for $TAG"
          else
            echo "$TAG already has a release"
          fi

  android:
    name: Android
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_ARGS: ${{ needs.prepare.outputs.mobile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/flutter
        with:
          java: "true"
      - uses: ./.github/actions/libtix
        with:
          target: android

      # Signed with the upload key when the four ANDROID_* secrets exist,
      # debug-signed otherwise (android/app/build.gradle.kts decides, and
      # `just package-android` puts "-debug-signed" in the file names).
      - name: Install the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; the Android packages are debug-signed."
            exit 0
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build the APK and the App Bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          just build-apk
          just build-aab
          just engine-check android build/app/outputs/flutter-apk/app-*-release.apk
          just engine-check aab build/app/outputs/bundle/release/app-release.aab

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - run: just package-android

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-android
          path: dist/
          retention-days: 7
          if-no-files-found: error

  linux:
    name: Linux (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # arm64 builds from a git clone of the SDK (Flutter publishes no Linux
    # arm64 archive), so a hiccup there should not hold back every other
    # platform's release.
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_ARGS: ${{ needs.prepare.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/flutter
      - uses: ./.github/actions/libtix
        with:
          target: linux
      - run: just setup-linux
      - run: just build-linux
      - env:
          ARCH: ${{ matrix.arch }}
        run: just engine-check bundle "build/linux/$ARCH/release/bundle"
      - env:
          ARCH: ${{ matrix.arch }}
        run: just package-linux "$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-linux-${{ matrix.arch }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  macos:
    name: macOS
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_ARGS: ${{ needs.prepare.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/flutter
      - uses: ./.github/actions/libtix
        with:
          target: macos
      # Ad-hoc signed only. TODO: Developer ID signing and notarization
      # (`xcrun notarytool`) once there is an Apple Developer account, so
      # Gatekeeper opens the app without a right-click.
      - run: just build-macos
      - run: just engine-check bundle build/macos/Build/Products/Release
      - run: just package-macos
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-macos
          path: dist/
          retention-days: 7
          if-no-files-found: error

  windows:
    name: Windows
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_ARGS: ${{ needs.prepare.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/flutter
      - uses: ./.github/actions/libtix
        with:
          target: windows
      - run: just build-windows
      - run: just engine-check bundle build/windows/x64/runner/Release
      - run: just package-windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-windows
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # Built so a release proves iOS still compiles, and kept as a workflow
  # artifact only: an unsigned .app installs nowhere, so it is not attached.
  #
  # TODO: TestFlight. Add an App Store Connect API key (APP_STORE_CONNECT_KEY_ID,
  # APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_P8) and a distribution
  # certificate plus provisioning profile (fastlane match, or the certificate
  # as a base64 secret imported into a temporary keychain), commit
  # ios/ExportOptions.plist, then replace the build below with `just build-ipa`
  # and upload with `xcrun altool --upload-app` or fastlane `pilot`.
  ios:
    name: iOS (unsigned)
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_ARGS: ${{ needs.prepare.outputs.mobile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/flutter
      - uses: ./.github/actions/libtix
        with:
          target: ios
      - run: just build-ios
      - run: just engine-check bundle build/ios/iphoneos/Runner.app
      - run: just package-ios
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ios-unsigned
          path: dist/
          retention-days: 14
          if-no-files-found: error

  # Checksums over everything, a keyless cosign signature over the checksums,
  # SLSA build provenance for every file, then upload and publish. Publishing
  # is last so the release never appears without its downloads.
  publish:
    name: Checksum, sign, attest and publish
    needs: [prepare, android, linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Keyless cosign and the provenance attestation both need the runner's
      # OIDC token.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - id: just
        run: echo "version=$(awk '$1 == "just" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
        with:
          just-version: ${{ steps.just.outputs.version }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: just checksums

      - name: Sign the checksums
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      # Verified straight away against this workflow's identity, so a release
      # cannot ship a signature nobody can check.
      - name: Verify the signature
        working-directory: dist
        env:
          IDENTITY: ^https://github\.com/${{ github.repository }}/\.github/workflows/release\.yaml@
        run: |
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \
            --certificate-identity-regexp "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Upload to the release and publish it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "published $TAG with $(find dist -type f | wc -l) files"
