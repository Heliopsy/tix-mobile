name: Release

# Builds every platform for a tag, attaches the packages, checksums and their
# signature to the tag's release, and publishes it. The store channels
# (TestFlight, notarisation, Google Play) run only when their secrets exist;
# scripts/release-secrets.sh decides and docs/releasing.md lists them.
#
# Triggers: a tag pushed by hand, or a dispatch from release-please.yml. The
# tag release-please writes uses GITHUB_TOKEN, which raises no push event, so
# release-please asks for this build explicitly. There is deliberately no
# `release: published` trigger: release-please creates a DRAFT, and this
# workflow is what publishes it, as its last step, once the downloads are
# attached. Listening for "published" too would only rebuild what was just
# released. Dispatching by hand rebuilds an existing tag; uploads replace
# assets of the same name.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: The tag to build, e.g. v0.1.0.
        required: true
        type: string

permissions: read-all

# One build per tag at a time; a second dispatch for the same tag waits rather
# than racing the first to the same asset names.
concurrency:
  group: release-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Prepare the release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.names.outputs.tag }}
      version: ${{ steps.names.outputs.version }}
      mobile: ${{ steps.names.outputs.mobile }}
      desktop: ${{ steps.names.outputs.desktop }}
      code: ${{ steps.names.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Resolve the tag and the build flags
        id: names
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          tag="${REF:-$GITHUB_REF_NAME}"
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "mobile=$(scripts/build-version.sh "$tag" mobile)"
            echo "desktop=$(scripts/build-version.sh "$tag" desktop)"
            echo "code=$(scripts/build-version.sh "$tag" mobile | sed -E 's/.*--build-number=([0-9]+).*/\1/')"
          } >> "$GITHUB_OUTPUT"

      # release-please leaves a draft. A tag pushed by hand has no release at
      # all, so one is created as a draft here, to be published by the last
      # job like any other. The releases list rather than `gh release view`,
      # which cannot see a draft.
      - name: Make sure a release exists for the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.names.outputs.tag }}
        run: |
          set -euo pipefail
          n=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                | jq --arg t "$TAG" '[.[] | select(.tag_name == $t)] | length')
          if [ "$n" = "0" ]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes --title "$TAG"
            echo "created a draft release for $TAG"
          else
            echo "$TAG already has a release"
          fi

  android:
    name: Android
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_ARGS: ${{ needs.prepare.outputs.mobile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/flutter
        with:
          java: "true"
      - uses: ./.github/actions/libtix
        with:
          target: android

      # Signed with the upload key when the four ANDROID_* secrets exist,
      # debug-signed otherwise (android/app/build.gradle.kts decides, and
      # `just package-android` puts "-debug-signed" in the file names).
      - name: Install the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; the Android packages are debug-signed."
            exit 0
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build the APK and the App Bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          just build-apk
          just build-aab
          just engine-check android build/app/outputs/flutter-apk/app-*-release.apk
          just engine-check aab build/app/outputs/bundle/release/app-release.aab
          just fdroid-check build/app/outputs/flutter-apk/app-*-release.apk

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - run: just package-android

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-android
          path: dist/
          retention-days: 7
          if-no-files-found: error

  linux:
    name: Linux (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # arm64 builds from a git clone of the SDK (Flutter publishes no Linux
    # arm64 archive), so a hiccup there should not hold back every other
    # platform's release.
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_ARGS: ${{ needs.prepare.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/flutter
      - uses: ./.github/actions/libtix
        with:
          target: linux
      - run: just setup-linux
      - run: just build-linux
      - env:
          ARCH: ${{ matrix.arch }}
        run: just engine-check bundle "build/linux/$ARCH/release/bundle"
      - env:
          ARCH: ${{ matrix.arch }}
        run: just package-linux "$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-linux-${{ matrix.arch }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  macos:
    name: macOS
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_ARGS: ${{ needs.prepare.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/flutter
      - uses: ./.github/actions/libtix
        with:
          target: macos
      - run: just build-macos
      - run: just engine-check bundle build/macos/Build/Products/Release

      # Developer ID signed and notarised when the certificate and the App
      # Store Connect API key are all there; ad-hoc signed, as Flutter leaves
      # it, otherwise. Gatekeeper opens a notarised app without a right-click.
      - name: Check for the macOS signing secrets
        id: creds
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          scripts/release-secrets.sh notarize MACOS_CERT_P12_BASE64 MACOS_CERT_PASSWORD \
            -- APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_BASE64

      - name: Sign with Developer ID and notarise
        if: steps.creds.outputs.notarize == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          set -euo pipefail
          app=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)
          id=$(scripts/macos-notarize.sh keychain)
          scripts/macos-notarize.sh sign "$app" "$id"
          scripts/macos-notarize.sh notarize "$app"
          just engine-check bundle build/macos/Build/Products/Release

      - name: Remove the signing keychain
        if: always() && steps.creds.outputs.notarize == 'true'
        run: security delete-keychain "$RUNNER_TEMP/tix-signing.keychain-db" || true

      - run: just package-macos
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-macos
          path: dist/
          retention-days: 7
          if-no-files-found: error

  windows:
    name: Windows
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_ARGS: ${{ needs.prepare.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/flutter
      - uses: ./.github/actions/libtix
        with:
          target: windows
      - run: just build-windows
      - run: just engine-check bundle build/windows/x64/runner/Release
      - run: just package-windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-windows
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # With the iOS signing secrets and the App Store Connect API key, a signed
  # IPA is built and uploaded to TestFlight. Without them the app is built
  # unsigned, which proves iOS still compiles, and kept as a workflow artifact
  # only: an unsigned .app installs nowhere. Neither is attached to the
  # release, because an App Store IPA installs nowhere outside TestFlight
  # either. Not a dependency of publish: a TestFlight hiccup must not hold back
  # the downloads.
  #
  # Re-running a release whose IPA already reached TestFlight fails the upload
  # (App Store Connect refuses a build number twice). That is expected.
  ios:
    name: iOS
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_ARGS: ${{ needs.prepare.outputs.mobile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/flutter
      - uses: ./.github/actions/libtix
        with:
          target: ios

      - name: Check for the iOS signing secrets
        id: creds
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          scripts/release-secrets.sh testflight IOS_CERT_P12_BASE64 IOS_CERT_PASSWORD IOS_PROFILE_BASE64 APPLE_TEAM_ID \
            -- APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_BASE64

      - name: Build unsigned
        if: steps.creds.outputs.testflight != 'true'
        run: |
          just build-ios
          just engine-check bundle build/ios/iphoneos/Runner.app
          just package-ios
      - if: steps.creds.outputs.testflight != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ios-unsigned
          path: dist/
          retention-days: 14
          if-no-files-found: error

      - if: steps.creds.outputs.testflight == 'true'
        uses: ./.github/actions/fastlane

      - name: Install the certificate and the profile
        if: steps.creds.outputs.testflight == 'true'
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$IOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$IOS_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/appstore.mobileprovision"
          {
            echo "IOS_CERT_PATH=$RUNNER_TEMP/distribution.p12"
            echo "IOS_PROFILE_PATH=$RUNNER_TEMP/appstore.mobileprovision"
          } >> "$GITHUB_ENV"

      - name: Build the signed IPA
        if: steps.creds.outputs.testflight == 'true'
        env:
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          bundle exec fastlane ios ipa
          just engine-check bundle build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app

      - name: Remove the certificate and the profile
        if: always() && steps.creds.outputs.testflight == 'true'
        run: rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/appstore.mobileprovision"

      - name: Upload to TestFlight
        if: steps.creds.outputs.testflight == 'true'
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          set -euo pipefail
          ipa=$(find build/ios/ipa -maxdepth 1 -name '*.ipa' | head -1)
          [ -n "$ipa" ] || { echo "no IPA under build/ios/ipa" >&2; exit 1; }
          bundle exec fastlane ios testflight ipa:"$ipa"

  # Checksums over everything, a keyless cosign signature over the checksums,
  # SLSA build provenance for every file, then upload and publish. Publishing
  # is last so the release never appears without its downloads.
  publish:
    name: Checksum, sign, attest and publish
    needs: [prepare, android, linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Keyless cosign and the provenance attestation both need the runner's
      # OIDC token.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - id: just
        run: echo "version=$(awk '$1 == "just" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
        with:
          just-version: ${{ steps.just.outputs.version }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: just checksums

      # The desktop apps install an update only when SHA256SUMS carries an
      # Ed25519 signature by the key they pin. Without the secret the release
      # goes out unsigned and installed apps offer the download instead.
      - name: Check for the update signing key
        id: update_key
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: scripts/release-secrets.sh update_signing UPDATE_SIGNING_KEY

      - name: Sign the checksums for desktop updates
        if: steps.update_key.outputs.update_signing == 'true'
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: scripts/update-sign.sh dist/SHA256SUMS lib/src/data/update/signing_key.dart

      - name: Sign the checksums
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      # Verified straight away against this workflow's identity, so a release
      # cannot ship a signature nobody can check.
      - name: Verify the signature
        working-directory: dist
        env:
          IDENTITY: ^https://github\.com/${{ github.repository }}/\.github/workflows/release\.yaml@
        run: |
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \
            --certificate-identity-regexp "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Upload to the release and publish it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "published $TAG with $(find dist -type f | wc -l) files"

  # The App Bundle goes to Google Play's internal track once the release is
  # published, with the store text from fastlane/metadata/android and a
  # "what's new" made from this version's CHANGELOG.md section. Skipped
  # without PLAY_SERVICE_ACCOUNT_JSON, and when the bundle is debug-signed,
  # which Play refuses. Re-running after a successful upload fails here: Play
  # takes a version code once.
  play:
    name: Google Play (internal track)
    needs: [prepare, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      CODE: ${{ needs.prepare.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Check for the Play credentials
        id: creds
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: scripts/release-secrets.sh play PLAY_SERVICE_ACCOUNT_JSON -- ANDROID_KEYSTORE_BASE64

      - if: steps.creds.outputs.play == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist-android
          path: dist

      - if: steps.creds.outputs.play == 'true'
        uses: ./.github/actions/fastlane

      - name: Upload to the internal track
        if: steps.creds.outputs.play == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS }}
        run: |
          set -euo pipefail
          scripts/store-changelog.sh "$VERSION" "$CODE"
          bundle exec fastlane android internal aab:"dist/tix-mobile-$VERSION-android.aab"
