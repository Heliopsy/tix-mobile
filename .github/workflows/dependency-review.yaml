name: Dependency Review

on:
  pull_request:
    branches: [main]
  # Required checks must report in the merge queue too; the review itself
  # only means something on a pull request, so the job skips there.
  merge_group:

permissions: read-all

jobs:
  # Reads pubspec.lock and the pinned actions in the diff, and fails a pull
  # request that adds a dependency with a known high or critical advisory.
  review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec  # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
