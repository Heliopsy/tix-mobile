  go_router: ^18.1.3
  hooks: ^2.2.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  material_ui: ^1.10.0
  meta: ^1.19.0
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.8
  share_plus: ^13.3.1
