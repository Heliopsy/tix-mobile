publish_to: 'none'
version: 0.2.0+3

environment:
  sdk: ^3.13.7

dependencies:
  code_assets: ^2.2.0
  dio: ^5.11.1
  dynamic_color: ^2.1.0
  ffi: ^2.2.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_riverpod: ^3.5.0
