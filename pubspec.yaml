name: tix_mobile
description: "Mobile and desktop client for tix"
publish_to: 'none'
version: 0.6.0+7

environment:
  sdk: ^3.13.7

dependencies:
  battery_plus: ^7.1.2
  code_assets: ^2.2.0
  # 7.1 and later read NWPath.isUltraConstrained, which needs Xcode 26; CI builds
  # Apple targets on macos-15. Lift this once the runners move.
  connectivity_plus: ">=7.0.0 <7.1.0"
  dio: ^5.11.1
  ffi: ^2.2.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.0
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.3
  home_widget: ^0.10.0
  hooks: ^2.2.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  json_annotation: ^4.12.0
  material_ui: ^1.10.0
  meta: ^1.19.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  quick_actions: ^1.1.1
  riverpod_annotation: ^4.0.8
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  timezone: ^0.11.2
  url_launcher: ^6.3.3

dev_dependencies:
  build_runner: ^2.17.1
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.10
  riverpod_lint: ^3.2.0
  shared_preferences_platform_interface: ^2.4.2
  very_good_analysis: ^11.0.0
  yaml: ^3.1.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/app/
    - assets/licenses/
